[project]
name = "telethonk"
version = "0.1.0"
description = "Home Assistant-native Twilio receptionist"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.7.2",
  "home-assistant-frontend==20260624.5",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-homeassistant-custom-component==0.13.346",
  "ruff>=0.12.0",
  "twilio==6.32.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
